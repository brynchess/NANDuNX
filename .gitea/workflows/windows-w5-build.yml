name: Windows W5 test build

on:
  push:
    branches: [windows]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: nandunx-release-windows
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pinned MSVC Rust toolchain
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add rustfmt --toolchain 1.90.0
          rustup default 1.90.0
      - name: Build and test both executables
        shell: powershell
        run: ./scripts/windows/w5-ci-build.ps1
      - name: Upload Windows test executables
        uses: actions/upload-artifact@v3
        with:
          name: nandunx-windows-w5-debug
          path: windows-test/*
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: nandunx-windows-w5-report
          path: w5-ci-report.txt
