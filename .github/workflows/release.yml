name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add rustfmt --toolchain 1.90.0
          rustup default 1.90.0
      - name: Build release assets
        run: scripts/release/build-artifacts.sh "${GITHUB_REF_NAME}"
      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned MSVC Rust toolchain
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add rustfmt --toolchain 1.90.0
          rustup default 1.90.0
      - name: Build Windows installer
        shell: pwsh
        run: scripts/release/build-windows.ps1 -Tag $env:GITHUB_REF_NAME -OutputDirectory release
      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Create combined checksum manifest
        run: |
          rm -- release/SHA256SUMS
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --title "NANDuNX ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
